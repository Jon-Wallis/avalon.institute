<style>
  :root {
    --ink: #10253F;
    --ink-deep: #0b1a2e;
    --parchment: #EEE6D5;
    --parchment-dim: rgba(238,230,213,0.72);
    --parchment-faint: rgba(238,230,213,0.4);
    --copper: #B26E45;
    --copper-bright: #c9885c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--ink); color: var(--parchment);
    font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.65;
    display: flex; flex-direction: column;
  }
  .rail { height: 10px; background: var(--ink-deep); }
  .rail-tick { height: 3px; background: var(--copper); width: 120px; }
  nav {
    padding: 1.4rem 2.5rem 0.6rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem;
    font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
  }
  nav a { color: var(--parchment-dim); text-decoration: none; transition: color 0.3s; }
  nav a:hover { color: var(--copper-bright); }
  a:focus-visible { outline: 2px solid var(--copper-bright); outline-offset: 4px; }
  .brand { color: var(--copper-bright); letter-spacing: 0.28em; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem 4rem; }
  .card { max-width: 640px; text-align: center; border: 1px solid var(--parchment-faint); padding: 8px; }
  .card-inner { border: 1px solid var(--parchment-faint); padding: 4rem 2.2rem 3.6rem; }
  .eyebrow { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--copper-bright); }
  h1 {
    font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 7vw, 3.8rem); font-weight: 700;
    line-height: 1.08; margin: 1.1rem 0 0.9rem; color: var(--parchment);
  }
  .date { font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--parchment-dim); }
  .rule { width: 72px; height: 1px; background: var(--copper); margin: 1.8rem auto; }
  .lede { font-size: 1.12rem; color: var(--parchment-dim); font-style: italic; max-width: 460px; margin: 0 auto; }
  .tag {
    display: inline-block; margin-top: 1.8rem; font-family: 'Cinzel', serif; font-size: 0.62rem;
    letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink); background: var(--copper); padding: 0.4rem 0.9rem;
  }
  .back { margin-top: 2.4rem; }
  .back a {
    font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--copper-bright); text-decoration: none; border-bottom: 1px solid var(--parchment-faint); padding-bottom: 2px;
  }
  .back a:hover { border-bottom-color: var(--copper-bright); }
  footer { text-align: center; padding: 1.8rem 1.5rem 2.2rem; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--parchment-dim); }
</style>

<div class="rail"><div class="rail-tick"></div></div>
<nav>
  <a class="brand" href="https://avalon.institute">The Avalon Institute</a>

</nav>

<main>
  <div class="card">
    <div class="card-inner">
      <div class="eyebrow">The Avalon Exposition Presents</div>
      <h1>The Halloween Gala</h1>
      <div class="date">Saturday · October 31, 2026 · Lighthaven, Berkeley</div>
      <div class="rule"></div>
      <span class="tag">Included with Your Exposition Ticket</span>
      <p class="lede" style="margin-top:1.8rem; font-size:0.98rem;">Details forthcoming.</p>
      <div class="back"><a href="../">← The Avalon Exposition</a></div>
    </div>
  </div>
</main>

<footer>The Avalon Institute · MMXXVI</footer>

</body>
