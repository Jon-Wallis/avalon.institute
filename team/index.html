<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Team — The Avalon Institute</title>
<link rel="icon" type="image/png" href="../favicon.png"/>
<meta content="The team of the Avalon Institute." name="description"/>
<link rel="canonical" href="https://avalon.institute/team/"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Cinzel:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root { --green-deep:#141c12; --gold:#d89a3a; --gold-dim:#9a6a1f; --cream:#f0e8d6; --text:#e8dfc8; --text-dim:#a99f8c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--green-deep); color:var(--text); font-family:'EB Garamond',Georgia,serif; min-height:100vh; }
  a { color:var(--gold); text-decoration:none; }
  a:hover { color:var(--cream); }
  a:focus-visible { outline:2px solid var(--cream); outline-offset:5px; }
  nav { width:min(80rem,calc(100% - 4rem)); margin:auto; padding:1.5rem 0; display:flex; justify-content:space-between; align-items:center; gap:1.5rem; font:400 .75rem/1.5 'Cinzel',serif; letter-spacing:.12em; }
  nav .pg { color:var(--text-dim); }
  .masthead { text-align:center; margin:1rem auto 0; }
  h1 { margin:0; font:500 2.6rem/1.2 'Cinzel',serif; letter-spacing:.1em; color:var(--cream); }
  .rule { display:flex; align-items:center; gap:.8rem; width:min(32rem,72%); margin:1.25rem auto 0; }
  .rule::before,.rule::after { content:''; flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold-dim),transparent); }
  .rule span { color:var(--gold); font:.75rem 'Cinzel',serif; }
  .team-grid { display:grid; grid-template-areas:'fellows leadership departments arts'; grid-template-columns:3fr 2fr 3fr 2fr; gap:1.5rem; align-items:start; width:min(80rem,calc(100% - 4rem)); margin:2rem auto 3rem; }
  .team-group { min-width:0; padding-top:12.75rem; }
  .leadership { grid-area:leadership; padding-top:0; }
  .fellows { grid-area:fellows; }
  .departments { grid-area:departments; }
  .arts { grid-area:arts; }
  h2 { display:flex; align-items:end; justify-content:center; min-height:3rem; margin:0 0 1.25rem; text-align:center; font:400 .875rem/1.5 'Cinzel',serif; letter-spacing:.1em; color:var(--gold); }
  .people { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.5rem .625rem; list-style:none; padding:0; margin:0; }
  .leadership .people,.arts .people { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .person { min-width:0; margin:0; text-align:center; }
  .person--lead { grid-column:1/-1; }
  figure { margin:0; }
  .portrait { display:block; width:7rem; max-width:100%; padding:4px; border:1px solid var(--gold-dim); margin:0 auto; }
  .portrait img { display:block; width:100%; height:auto; aspect-ratio:1; object-fit:cover; }
  .person--lead .portrait { width:9rem; border-color:var(--gold); }
  figcaption { margin:.65rem auto 0; min-height:2.5em; font-size:1.125rem; line-height:1.25; color:var(--cream); }
  .person--lead figcaption { min-height:0; }
  footer { padding:0 1.25rem 2.5rem; text-align:center; color:var(--text-dim); font-size:1rem; }
  footer .rule { margin-top:0; margin-bottom:1.5rem; }
  @media (max-width:1199px) {
    .team-grid { grid-template-areas:'leadership fellows' 'departments arts'; grid-template-columns:repeat(2,minmax(0,1fr)); gap:3rem; width:min(62rem,calc(100% - 4rem)); }
    .team-group { padding-top:0; }
    .leadership .people { max-width:19rem; margin:auto; }
    .portrait { width:8rem; }
    .arts .people { max-width:22rem; margin:auto; }
  }
  @media (max-width:699px) {
    nav { width:calc(100% - 2.5rem); padding:1.25rem 0; font-size:.7rem; letter-spacing:.08em; }
    nav a { max-width:13rem; }
    .masthead { margin-top:.75rem; }
    h1 { font-size:2rem; }
    .team-grid { grid-template-areas:'leadership' 'fellows' 'departments' 'arts'; grid-template-columns:minmax(0,1fr); width:min(28rem,calc(100% - 2.5rem)); margin:1.5rem auto 3rem; gap:2.5rem; }
    h2 { min-height:0; margin-bottom:1.5rem; font-size:.875rem; }
    .people { grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.5rem 1.25rem; }
    .departments .person:last-child { grid-column:1/-1; width:calc((100% - 1.25rem)/2); justify-self:center; }
    .arts .people { max-width:none; }
    figcaption { font-size:1.125rem; }
  }
</style>
</head>
<body>
<nav aria-label="Main"><a href="../">The Avalon Institute</a><span class="pg" aria-current="page">Team</span></nav>
<header class="masthead"><h1>Team</h1><div class="rule" aria-hidden="true"><span>◇</span></div></header>
<main class="team-grid">
  <section class="team-group leadership" aria-labelledby="leadership-heading">
    <h2 id="leadership-heading">Leadership</h2>
    <ul class="people">
    <li class="person person--lead"><figure><span class="portrait"><img src="photos/jonathan-wallis.jpg" alt="Jonathan Wallis" width="640" height="640"/></span><figcaption>Jonathan Wallis</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/duncan-umphrey.jpg" alt="Duncan Umphrey" width="640" height="640"/></span><figcaption>Duncan Umphrey</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/zenon-mackinnon.jpg" alt="Zénon MacKinnon" width="640" height="640"/></span><figcaption>Zénon MacKinnon</figcaption></figure></li>
    </ul>
  </section>
  <section class="team-group fellows" aria-labelledby="fellows-heading">
    <h2 id="fellows-heading">Fellows</h2>
    <ul class="people">
    <li class="person"><figure><span class="portrait"><img src="photos/stephen-pimentel.jpg" alt="Stephen Pimentel" width="640" height="640" loading="lazy"/></span><figcaption>Stephen Pimentel</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/brian-pines.jpg" alt="Brian Pines" width="640" height="640" loading="lazy"/></span><figcaption>Brian Pines</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/logan-graves.jpg" alt="Logan Graves" width="640" height="640" loading="lazy"/></span><figcaption>Logan Graves</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/adam-feng.jpg" alt="Adam Feng" width="640" height="640" loading="lazy"/></span><figcaption>Adam Feng</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/joshua-jayaprakash.jpg" alt="Joshua Jayaprakash" width="640" height="640" loading="lazy"/></span><figcaption>Joshua Jayaprakash</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/alex-oaten.jpg" alt="Alex Oaten" width="640" height="640" loading="lazy"/></span><figcaption>Alex Oaten</figcaption></figure></li>
    </ul>
  </section>
  <section class="team-group departments" aria-labelledby="departments-heading">
    <h2 id="departments-heading">Departments in Formation</h2>
    <ul class="people">
    <li class="person"><figure><span class="portrait"><img src="photos/michael-edward-johnson.jpg" alt="Michael Edward Johnson" width="640" height="640" loading="lazy"/></span><figcaption>Michael Edward Johnson</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/keoni-gandall.jpg" alt="Keoni Gandall" width="640" height="640" loading="lazy"/></span><figcaption>Keoni Gandall</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/york-westenhaver.jpg" alt="York Westenhaver" width="640" height="640" loading="lazy"/></span><figcaption>York Westenhaver</figcaption></figure></li>
    </ul>
  </section>
  <section class="team-group arts" aria-labelledby="arts-heading">
    <h2 id="arts-heading">Avalon Arts</h2>
    <ul class="people">
    <li class="person"><figure><span class="portrait"><img src="photos/michael-curzi.jpg" alt="Michael Curzi" width="640" height="640" loading="lazy"/></span><figcaption>Michael Curzi</figcaption></figure></li>
    <li class="person"><figure><span class="portrait"><img src="photos/lola-guthrie.jpg" alt="Lola Guthrie" width="640" height="640" loading="lazy"/></span><figcaption>Lola Guthrie</figcaption></figure></li>
    </ul>
  </section>
</main>
<footer><div class="rule" aria-hidden="true"><span>◇</span></div><a href="../">The Avalon Institute</a> · San Francisco</footer>
</body>
</html>
