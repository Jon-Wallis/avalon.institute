name: Conference roster lock

on:
  push:
    paths:
      - conference/index.html
      - conference/check-roster-lock.py
      - .github/workflows/conference-roster-lock.yml
  pull_request:
    paths:
      - conference/index.html
      - conference/check-roster-lock.py
      - .github/workflows/conference-roster-lock.yml

permissions:
  contents: read

jobs:
  check-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 conference/check-roster-lock.py
